name: tasklabs

# Full stack: Postgres (Convex's store) + Convex backend + dashboard + Next.js app.
# Always run Compose with an explicit env file, e.g.
#   docker compose --env-file .env -f docker-compose.yml up --build
# Docker development uses the standalone docker-compose.dev.yml file.
# No ports, origins, credentials, or runtime defaults may be hardcoded here.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: ${INSTANCE_NAME:?missing}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_API_PORT:?missing}:${CONVEX_API_INTERNAL_PORT:?missing}"
      - "${CONVEX_SITE_PROXY_PORT:?missing}:${CONVEX_SITE_INTERNAL_PORT:?missing}"
    volumes:
      - convex-data:/convex/data
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:?missing}
      - INSTANCE_SECRET=${INSTANCE_SECRET:?missing}
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:?missing}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:?missing}
      - POSTGRES_URL=${POSTGRES_URL:?missing}
      - DO_NOT_REQUIRE_SSL=${DO_NOT_REQUIRE_SSL:?missing}
      - DISABLE_BEACON=${DISABLE_BEACON:?missing}
      - RUST_LOG=${RUST_LOG:?missing}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CONVEX_API_INTERNAL_PORT:?missing}/version"]
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    ports:
      - "${CONVEX_DASHBOARD_PORT:?missing}:${CONVEX_DASHBOARD_INTERNAL_PORT:?missing}"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN:?missing}
      - CONVEX_DASHBOARD_INTERNAL_PORT=${CONVEX_DASHBOARD_INTERNAL_PORT:?missing}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.CONVEX_DASHBOARD_INTERNAL_PORT).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:?missing}
        TELEGRAM_API_ORIGIN: ${TELEGRAM_API_ORIGIN:?missing}
        NEXT_TURBOPACK_ROOT: ${NEXT_TURBOPACK_ROOT:?missing}
      # Docker Desktop local builds can collide on attestation manifest exports;
      # keep local Compose builds on the plain Docker exporter.
      x-bake:
        output: type=docker
    ports:
      - "${FRONTEND_PORT:?missing}:${FRONTEND_INTERNAL_PORT:?missing}"
    command: ["sh", "-c", "pnpm exec next start --hostname \"$${FRONTEND_HOST}\" --port \"$${FRONTEND_INTERNAL_PORT}\""]
    environment:
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:?missing}
      - TELEGRAM_API_ORIGIN=${TELEGRAM_API_ORIGIN:?missing}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:?missing}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?missing}
      - FRONTEND_HOST=${FRONTEND_HOST:?missing}
      - FRONTEND_INTERNAL_PORT=${FRONTEND_INTERNAL_PORT:?missing}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.FRONTEND_INTERNAL_PORT + '/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db-backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
      # Docker Desktop local builds can collide on attestation manifest exports;
      # keep local Compose builds on the plain Docker exporter.
      x-bake:
        output: type=docker
    restart: unless-stopped
    environment:
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE}
      - BACKUP_TIMEZONE=${BACKUP_TIMEZONE}
      - BACKUP_TMPDIR=${BACKUP_TMPDIR}
      - BACKUP_OBJECT_PREFIX=${BACKUP_OBJECT_PREFIX}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - INSTANCE_NAME=${INSTANCE_NAME}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT}
      - RUSTFS_REGION=${RUSTFS_REGION}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET}
      - RUSTFS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY_ID}
      - RUSTFS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_ACCESS_KEY}
      - RUSTFS_S3_ADDRESSING_STYLE=${RUSTFS_S3_ADDRESSING_STYLE}
      - TELEGRAM_API_ORIGIN=${TELEGRAM_API_ORIGIN}
      - BACKUP_TELEGRAM_BOT_TOKEN=${BACKUP_TELEGRAM_BOT_TOKEN}
      - BACKUP_TELEGRAM_CHAT_ID=${BACKUP_TELEGRAM_CHAT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  convex-data:
